<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rocket Engine Hand Control</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #webcam {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 135px;
            border-radius: 10px;
            border: 2px solid #00ffcc;
            transform: scaleX(-1);
            z-index: 10;
        }
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-family: monospace;
            z-index: 10;
        }
    </style>
    <!-- External JS Libraries (Three.js & MediaPipe) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

    <div id="status">Status: Loading AI Models & Camera...</div>
    <video id="webcam" autoplay playsinline></video>

    <script>
        // 1. THREE.JS SCENE SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight1.position.set(5, 10, 7);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x3366ff, 1.5);
        dirLight2.position.set(-5, -5, -5);
        scene.add(dirLight2);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));

        // 2. 3D MODEL LOADER
        let rocketModel;
        const loader = new THREE.GLTFLoader();

        // Rocket engine file loading
        loader.load('rocket_engine.glb', (gltf) => {
            rocketModel = gltf.scene;
            scene.add(rocketModel);
            document.getElementById('status').innerText = "Status: Camera Active! Move hand to rotate/zoom.";
        }, undefined, (error) => {
            document.getElementById('status').innerText = "Status: Load 'rocket_engine.glb' file in root directory.";
        });

        // 3. MEDIAPIPE HAND TRACKING & CONTROL LOGIC
        const videoElement = document.getElementById('webcam');
        let prevDistance = null;

        function onHandResults(results) {
            if (!rocketModel) return;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hands = results.multiHandLandmarks;

                // Single/First Hand Rotation Control
                const hand1Index = hands[0][8]; // Index Finger Tip ID 8
                rocketModel.rotation.y = (hand1Index.x - 0.5) * Math.PI * 4;
                rocketModel.rotation.x = (hand1Index.y - 0.5) * Math.PI * 2;

                // Two Hands Zoom Control
                if (hands.length === 2) {
                    const hand2Index = hands[1][8];
                    
                    // Euclidean distance between two index tips
                    const distance = Math.hypot(
                        hand2Index.x - hand1Index.x,
                        hand2Index.y - hand1Index.y
                    );

                    if (prevDistance !== null) {
                        const delta = distance - prevDistance;
                        camera.position.z -= delta * 6; // Adjust zoom sensitivity
                        camera.position.z = Math.max(1.8, Math.min(camera.position.z, 12));
                    }
                    prevDistance = distance;
                } else {
                    prevDistance = null;
                }
            } else {
                prevDistance = null;
            }
        }

        // Initialize MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onHandResults);

        // Webcam Setup
        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        cameraFeed.start();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
