<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Phone Extractor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            max-width: 600px;
            margin: auto;
            background-color: #f4f7f6;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .search-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            width: 100%;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            min-width: 0; /* Prevents input overflow on flex layout */
        }
        button {
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
            white-space: nowrap;
        }
        button:hover {
            background-color: #0056b3;
        }
        .copy-btn {
            background-color: #28a745;
            width: 100%;
            margin-bottom: 15px;
            display: none;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
        #results {
            background: #ffffff;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
            word-wrap: break-word; /* Fixes text going outside screen */
            overflow-wrap: break-word;
            font-family: monospace;
            font-size: 14px;
            min-height: 100px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h2>Location Phone Extractor</h2>

    <!-- Responsive Search Input & Button -->
    <div class="search-container">
        <input type="text" id="query" placeholder="e.g. PG in Salt Lake Kolkata">
        <button onclick="searchData()">Search</button>
    </div>

    <!-- Top Copy Button -->
    <button class="copy-btn" id="copyBtn" onclick="copyAllData()">Copy All Results</button>

    <!-- Results Box -->
    <div id="results">Search results will appear here...</div>

    <script>
        async function searchData() {
            const query = document.getElementById('query').value.trim();
            const resultsDiv = document.getElementById('results');
            const copyBtn = document.getElementById('copyBtn');

            if (!query) {
                alert("Please enter a location or search term!");
                return;
            }

            resultsDiv.innerHTML = "Fetching results... Please wait.";
            copyBtn.style.display = "none";

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `query=${encodeURIComponent(query)}`
                });

                const data = await response.json();

                if (data.error) {
                    resultsDiv.innerHTML = data.error;
                    return;
                }

                if (!data || data.length === 0) {
                    resultsDiv.innerHTML = "No results found.";
                    return;
                }

                let formattedText = "";
                data.forEach((item, index) => {
                    formattedText += `${index + 1}. Name: ${item.name}\n   Phone: ${item.phone}\n\n`;
                });

                resultsDiv.innerHTML = formattedText;
                copyBtn.style.display = "block";
            } catch (error) {
                resultsDiv.innerHTML = "Error connecting to server. Please try again.";
            }
        }

        function copyAllData() {
            const text = document.getElementById('results').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("All data copied to clipboard!");
            }).catch(err => {
                alert("Copy failed: " + err);
            });
        }
    </script>
</body>
</html>
