<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional 3D Photo Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0b0f19; color: #fff; text-align: center; padding: 30px 15px; min-height: 100vh; }
        
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { margin-bottom: 25px; color: #38bdf8; font-size: 2.2rem; text-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
        
        .upload-box {
            border: 2px dashed #38bdf8;
            padding: 40px 20px;
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: block;
        }
        .upload-box:hover { background: rgba(51, 65, 85, 0.8); border-color: #818cf8; transform: translateY(-2px); }
        input[type="file"] { display: none; }

        .btn {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            border: none;
            padding: 14px 32px;
            color: #fff;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: all 0.2s ease;
        }
        .btn:hover { transform: scale(1.03); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }

        .gallery-3d {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            margin-top: 50px;
        }

        .card-container {
            perspective: 1000px;
            width: 260px;
            height: 340px;
        }

        .card-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            border-radius: 16px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
            background: #1e293b;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-3d img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            transform: translateZ(35px);
        }

        .card-3d::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 60%);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>3D Interactive Photo Studio</h1>
    <form id="uploadForm">
        <label class="upload-box" for="photoInput">
            <p id="uploadText" style="font-size: 18px; font-weight: 500;"><strong>Gallery se Photos Select Karein</strong></p>
            <p style="font-size: 13px; color: #94a3b8; margin-top: 8px;">Aap kitni bhi photos ek sath select kar sakte hain (PNG, JPG, WEBP)</p>
        </label>
        <input type="file" id="photoInput" name="photos" multiple accept="image/*" onchange="updateFileName()">
        <br>
        <button type="submit" class="btn">Generate 3D Photos</button>
    </form>

    <div class="gallery-3d" id="gallery"></div>
</div>

<script>
    const form = document.getElementById('uploadForm');
    const gallery = document.getElementById('gallery');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const files = document.getElementById('photoInput').files;
        if (files.length === 0) return alert('Kripya kam se kam ek photo select karein!');

        const formData = new FormData();
        for (let i = 0; i < files.length; i++) {
            formData.append('photos', files[i]);
        }

        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();

        gallery.innerHTML = '';
        data.image_urls.forEach(url => {
            create3DCard(url);
        });
    });

    function create3DCard(imgUrl) {
        const container = document.createElement('div');
        container.className = 'card-container';

        const card = document.createElement('div');
        card.className = 'card-3d';

        const img = document.createElement('img');
        img.src = imgUrl;

        card.appendChild(img);
        container.appendChild(card);
        gallery.appendChild(container);

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const rotateX = (-y / rect.height) * 35;
            const rotateY = (x / rect.width) * 35;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
        });
    }

    function updateFileName() {
        const input = document.getElementById('photoInput');
        const label = document.getElementById('uploadText');
        label.innerText = `${input.files.length} Photos Selected! Generate button par click karein.`;
    }
</script>

</body>
</html>
